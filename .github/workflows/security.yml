name: Security and build
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: alpha_test
          POSTGRES_PASSWORD: disposable_ci_password
          POSTGRES_DB: alpha_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://alpha_test:disposable_ci_password@localhost:5432/alpha_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run build
      - run: npm run test:web-quality
      - run: npx prisma migrate deploy --schema packages/database/prisma/schema.prisma
      - run: node scripts/security-integration.cjs
      - run: npm run test --workspace=apps/api -- --runInBand
      - run: npm run test:e2e --workspace=apps/api -- --runInBand
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npm run test --workspace=packages/ai-engine
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
