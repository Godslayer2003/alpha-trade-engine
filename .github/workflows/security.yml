name: Security and build
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: alpha_test
          POSTGRES_PASSWORD: disposable_ci_password
          POSTGRES_DB: alpha_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://alpha_test:disposable_ci_password@localhost:5432/alpha_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run build
      - run: npm run test:web-quality
      - run: npx prisma migrate deploy --schema packages/database/prisma/schema.prisma
      - run: node scripts/security-integration.cjs
      - run: npm run test --workspace=apps/api -- --runInBand
      - run: npm run test:e2e --workspace=apps/api -- --runInBand
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npm run test --workspace=packages/ai-engine
      - name: Build API production container
        run: docker build --tag alpha-api-runtime-test --file apps/api/Dockerfile .
      - name: Check API runtime privileges and production cookies
        run: |
          set -euo pipefail
          docker run --rm --entrypoint sh alpha-api-runtime-test -c 'test "$(id -u)" -ne 0 && test "$NODE_ENV" = production && test ! -w /repo/apps/api/dist/main.js'
          trap 'docker rm --force alpha-api-runtime-test >/dev/null 2>&1 || true' EXIT
          docker run --detach --name alpha-api-runtime-test --network host --env DATABASE_URL --env PORT=3007 --env JWT_SECRET=disposable-runtime-test-signing-key --env MFA_ENCRYPTION_KEY=BwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwc= --env WEB_ORIGIN=http://localhost:3010 --env AI_ENGINE_SHARED_SECRET=disposable-runtime-engine-key alpha-api-runtime-test
          node scripts/api-runtime-check.cjs
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan all fetched Git history for secrets
        run: |
          set -euo pipefail
          tools_dir="${RUNNER_TEMP}/alpha-gitleaks"
          mkdir -p "$tools_dir"
          curl --fail --silent --show-error --location https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$tools_dir/gitleaks_8.30.1_linux_x64.tar.gz"
          curl --fail --silent --show-error --location https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt -o "$tools_dir/checksums.txt"
          (cd "$tools_dir" && grep ' gitleaks_8.30.1_linux_x64.tar.gz$' checksums.txt | sha256sum --check)
          tar -xzf "$tools_dir/gitleaks_8.30.1_linux_x64.tar.gz" -C "$tools_dir" gitleaks
          "$tools_dir/gitleaks" git --log-opts="--all" --redact=100 --no-banner --log-level=error .
