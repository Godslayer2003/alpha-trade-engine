version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: alpha_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: alpha_redis
    ports:
      - "6379:6379"

  ai-engine:
    build:
      context: ./packages/ai-engine
      dockerfile: Dockerfile
    container_name: alpha_ai_engine
    ports:
      - "8000:8000"
    environment:
      - MODEL_ENV=development

volumes:
  pgdata:
