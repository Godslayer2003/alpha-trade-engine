# Render Blueprint — replaces Railway for the API server and AI engine.
# Deploy via Render's dashboard: New > Blueprint, point it at this repo.
# No secrets live in this file (sync: false means "ask the user to type it
# in during setup, store it only in Render, never in git").
services:
  - name: alpha-trade-engine-api
    type: web
    runtime: docker
    plan: free
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: RESEND_API_KEY
        sync: false
      # AI Guide chatbot $5 paywall — chat stays unlocked for everyone if unset.
      - key: STRIPE_SECRET_KEY
        sync: false
      # Set manually after the ai-engine service below gets its real URL —
      # see the AI-engine setup instructions.
      - key: AI_ENGINE_URL
        sync: false
      # Must match AI_ENGINE_SHARED_SECRET on alpha-trade-engine-ai below —
      # any random string, generated once and pasted into both services.
      - key: AI_ENGINE_SHARED_SECRET
        sync: false
      # Comma-separated list of emails allowed to edit the AI Guide's
      # config and view the feedback log (e.g. "you@example.com").
      - key: ADMIN_EMAILS
        sync: false
      # The live web app's origin (e.g. https://alpha-trade-engine-web.vercel.app).
      - key: WEB_ORIGIN
        sync: false

  - name: alpha-trade-engine-ai
    type: web
    runtime: docker
    plan: free
    dockerfilePath: ./packages/ai-engine/Dockerfile
    dockerContext: .
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false
      # Must match AI_ENGINE_SHARED_SECRET on alpha-trade-engine-api above.
      - key: AI_ENGINE_SHARED_SECRET
        sync: false
