# Render Blueprint for the API server and AI engine.
# Deploy via Render's dashboard: New > Blueprint, point it at this repo.
# No secrets live in this file (sync: false means "ask the user to type it
# in during setup, store it only in Render, never in git").
services:
  - name: alpha-trade-engine-api
    type: web
    runtime: docker
    plan: free
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      # Supply a base64-encoded 32-byte key. Preserve the existing key on updates.
      - key: MFA_ENCRYPTION_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: RESEND_API_KEY
        sync: false
      # AI Guide one-time payment. Production chat fails closed if unset.
      - key: STRIPE_SECRET_KEY
        sync: false
      # Set manually after the ai-engine service below gets its real URL —
      # see the AI-engine setup instructions.
      - key: AI_ENGINE_URL
        sync: false
      # Must match AI_ENGINE_SHARED_SECRET on alpha-trade-engine-ai below —
      # any random string, generated once and pasted into both services.
      - key: AI_ENGINE_SHARED_SECRET
        sync: false
      # Legacy reserved registration addresses; this does not grant admin access.
      # Admin access requires an explicit database role and verified MFA.
      - key: ADMIN_EMAILS
        sync: false
      # The live web app's origin (e.g. https://alpha-trade-engine-web.vercel.app).
      - key: WEB_ORIGIN
        sync: false

  - name: alpha-trade-engine-ai
    type: web
    runtime: docker
    plan: free
    dockerfilePath: ./packages/ai-engine/Dockerfile
    dockerContext: .
    envVars:
      # Must match AI_ENGINE_SHARED_SECRET on alpha-trade-engine-api above.
      - key: AI_ENGINE_SHARED_SECRET
        sync: false
